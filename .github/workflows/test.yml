name: Test scripts

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack yarn@1.22.22 install --frozen-lockfile
      - run: corepack yarn@1.22.22 test --runInBand
      - name: Verify native canvas binding
        run: node --input-type=module -e "import { createCanvas } from 'canvas'; createCanvas(2, 2).toBuffer();"
